name: Verify (Arena)

on:
  push:
    branches: ['arena/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHPUnit (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, zip, gd, dom, xml, iconv, mbstring, fileinfo, curl
          coverage: none

      - name: Install dependencies Composer
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: |
          set -o pipefail
          if ! composer install --no-interaction --no-progress --prefer-dist 2>&1 | tee composer-install.log; then
            echo "::error title=composer::composer install gagal. Baris penting:"
            grep -iE "error|problem|failed|exceed" composer-install.log | head -n 8 | while IFS= read -r l; do echo "::error title=composer::$l"; done
            exit 1
          fi

      - name: Siapkan environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Jalankan test suite
        run: |
          set -o pipefail
          if ! vendor/bin/phpunit --no-progress --log-junit junit.xml 2>&1 | tee phpunit.log; then
            echo "::error title=phpunit::Test suite TIDAK lolos:"
            grep -E "^[0-9]+\) " phpunit.log | head -n 10 | while IFS= read -r l; do echo "::error title=phpunit::$l"; done
            grep -E "^(Tests:|Time:|FAILURES|ERRORS)" phpunit.log | head -n 3 | while IFS= read -r l; do echo "::error title=phpunit::$l"; done
            exit 1
          fi

      - name: Ringkas detail kegagalan (bila ada)
        if: failure()
        run: |
          if [ -f phpunit.log ]; then
            echo "::notice title=phpunit-logtail::$(tail -n 3 phpunit.log | tr '\n' ' ')"
          fi
          if [ ! -f junit.xml ]; then echo "::warning title=phpunit::junit.xml tidak tersedia"; exit 0; fi
          php -r '
            $x = simplexml_load_file("junit.xml");
            $i = 0;
            foreach ($x->xpath("//testcase[failure or error]") as $t) {
                if (++$i > 10) break;
                $f = ($t->failure ?: $t->error)[0];
                $msg = trim((string) $f);
                $msg = preg_replace("/\s+/u", " ", $msg);
                if (strlen($msg) > 1500) $msg = substr($msg, 0, 1500) . "…";
                $file = (string) $t->attributes()["file"] . ":" . (string) $t->attributes()["line"];
                echo "::error title=phpunit-detail::" . (string) $t->attributes()["name"] . " :: " . $msg . " @ " . $file . PHP_EOL;
            }
            $ts = $x->xpath("//testsuite")[0]->attributes();
            echo "::notice title=phpunit-summary::tests=" . $ts["tests"] . " failures=" . $ts["failures"] . " errors=" . $ts["errors"] . PHP_EOL;
          '

      - name: Unggah log phpunit sebagai artefak
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-logs
          path: |
            phpunit.log
            junit.xml
          if-no-files-found: ignore

      - name: Ringkas hasil
        if: success()
        run: grep -E "^(OK|Tests:)" phpunit.log | head -n 3 | while IFS= read -r l; do echo "::notice title=phpunit::$l"; done
